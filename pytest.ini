[pytest]
markers =
    regress: регрессионный набор, прогоняется на живом API Яндекс.Диска
    destructive: изменяет данные на диске (создание/удаление/перемещение и т.п.)
    slow: опрашивает статус асинхронных операций, может занимать больше времени
addopts = -ra --strict-markers
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(module)s %(lineno)d %(message)s
log_cli_date_format = '%Y-%m-%d %H:%M:%S'

pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
xfail_strict = true