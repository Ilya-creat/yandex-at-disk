name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      - name: Regression tests (non-destructive)
        run: pytest -m "regress and not destructive" --alluredir=allure-results

      - name: Regression tests (destructive)
        run: pytest -m "regress and destructive" --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

  publish-report:
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Load previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
