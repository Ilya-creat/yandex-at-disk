name: CI

on:
  push:
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Какие автотесты запускать"
        required: true
        default: all
        type: choice
        options:
          - all
          - non-destructive
          - destructive

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Regression tests (non-destructive)
        if: github.event_name != 'workflow_dispatch' || inputs.test_scope != 'destructive'
        run: pytest -m "regress and not destructive" --alluredir=allure-results

      - name: Regression tests (destructive)
        if: github.event_name != 'workflow_dispatch' || inputs.test_scope != 'non-destructive'
        run: pytest -m "regress and destructive" --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

  publish-report:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Download allure results from the test job
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Load previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
