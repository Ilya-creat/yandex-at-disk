name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Regression tests (non-destructive)
        run: pytest -m "regress and not destructive" --alluredir=allure-results

      - name: Regression tests (destructive)
        run: pytest -m "regress and destructive" --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
